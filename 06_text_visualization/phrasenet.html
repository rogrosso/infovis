        <!-- Scripts -->
        <script id="MathJax-script" async src="../../contrib/mathjax/es5/tex-mml-svg.js"></script>
        <script type="importmap">
            {
                "imports": {
                    "d3": "../../contrib/d3.esm.js",
                    "compromise": "../../contrib/compromise/compromise.esm.js",
                    "compromise-one": "../../contrib/compromise/compromise-one.esm.js",

    <body>
        <div class="infovis-lecture">
            <h1>Phrase Net</h1>
            
            <hr>
            <div class="canvas">
                <div id="phrasenet-menu" class="grid-container-2-column"></div>
                <div id="phrasenet-svg" class="phrasenet"></div>
                <script type="module">
                    import { drawAll } from "phrasenet"
                    const response = await fetch('../../data/waltwhitman_songofmyself.txt')
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const songofmyself = await response.text()
                    drawAll('#phrasenet-menu', '#phrasenet-svg', songofmyself)
                </script>
            </div>
            <hr>

                </div>
            </footer>
